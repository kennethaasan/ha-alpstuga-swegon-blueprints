blueprint:
  name: ALPSTUGA - bounded ventilation boost
  description: >-
    Request a bounded ventilation Boost after sustained high CO2 or humidity.
    Refuses unsafe PM2.5, restores the previous normal mode after recovery or a
    hard timeout, and never overrides a later manual mode change.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    co2_sensor:
      name: CO2 sensor
      description: ALPSTUGA carbon-dioxide concentration sensor.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: carbon_dioxide
    humidity_sensor:
      name: Humidity sensor
      description: ALPSTUGA relative-humidity sensor.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity
    pm25_sensor:
      name: PM2.5 sensor
      description: ALPSTUGA PM2.5 concentration sensor used as a safety limit.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: pm25
    predictive_demand_sensors:
      name: Predictive demand sensors
      description: >-
        Optional binary sensors that turn on before a measured threshold is
        reached, for example a rate-of-rise CO2 forecast. Any listed sensor can
        request Boost, but all normal safety and mode checks still apply.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
          multiple: true
    predictive_trigger_duration:
      name: Sustained predictive demand before starting
      default: "00:05:00"
      selector:
        duration:
    additional_safety_entities:
      name: Additional safety entities
      description: >-
        Optional binary sensors that must all remain on for automatic Boost.
        Use these for ventilation alarms, telemetry freshness, or a master
        enable switch. Missing, unavailable, unknown, or off is unsafe.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
          multiple: true
    additional_safety_duration:
      name: Sustained additional-safety failure before restoring
      default: "00:05:00"
      selector:
        duration:
    ventilation_mode:
      name: Ventilation mode
      description: Select entity that controls the ventilation operating mode.
      selector:
        entity:
          filter:
            - domain: select
    ownership_helper:
      name: Boost ownership helper
      description: >-
        Input boolean used to persist that this automation owns Boost across a
        Home Assistant restart.
      selector:
        entity:
          filter:
            - domain: input_boolean
    previous_mode_helper:
      name: Previous-mode helper
      description: >-
        Input select used to persist the normal mode that should be restored.
        Its options must include every eligible mode and the fallback mode.
      selector:
        entity:
          filter:
            - domain: input_select
    maximum_timer:
      name: Maximum-duration timer
      description: >-
        Timer used to persist the hard Boost deadline. Configure the timer with
        restore enabled; the blueprint supplies its duration when Boost starts.
      selector:
        entity:
          filter:
            - domain: timer
    boost_option:
      name: Boost option
      default: Boost
      selector:
        text:
    eligible_modes:
      name: Modes automation may take over
      description: Comma-separated normal modes. Away modes should not be listed.
      default: "Automatic,Home,Home +"
      selector:
        text:
    restorable_modes:
      name: Writable modes that can be restored
      description: >-
        Comma-separated subset of eligible modes that the integration can
        write. Read-only automatic/transient states use the fallback mode.
      default: "Home,Home +"
      selector:
        text:
    fallback_mode:
      name: Safe fallback mode
      description: Used only if the previous mode is no longer eligible.
      default: Home
      selector:
        text:
    co2_start:
      name: CO2 start threshold
      default: 1000
      selector:
        number:
          min: 600
          max: 2500
          step: 50
          unit_of_measurement: ppm
    co2_stop:
      name: CO2 recovery threshold
      default: 800
      selector:
        number:
          min: 400
          max: 1500
          step: 50
          unit_of_measurement: ppm
    humidity_start:
      name: Humidity start threshold
      default: 65
      selector:
        number:
          min: 40
          max: 90
          step: 1
          unit_of_measurement: "%"
    humidity_stop:
      name: Humidity recovery threshold
      default: 60
      selector:
        number:
          min: 30
          max: 80
          step: 1
          unit_of_measurement: "%"
    pm25_limit:
      name: PM2.5 safety limit
      default: 25
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: µg/m³
    trigger_duration:
      name: Sustained demand before starting
      default: "00:10:00"
      selector:
        duration:
    recovery_duration:
      name: Sustained recovery before restoring
      default: "00:15:00"
      selector:
        duration:
    maximum_duration:
      name: Hard maximum Boost duration
      default: "02:00:00"
      selector:
        duration:

variables:
  co2_entity: !input co2_sensor
  humidity_entity: !input humidity_sensor
  pm25_entity: !input pm25_sensor
  predictive_demand: !input predictive_demand_sensors
  additional_safety: !input additional_safety_entities
  ventilation_entity: !input ventilation_mode
  ownership_entity: !input ownership_helper
  previous_mode_entity: !input previous_mode_helper
  maximum_timer_entity: !input maximum_timer
  boost_mode: !input boost_option
  eligible_modes_text: !input eligible_modes
  restorable_modes_text: !input restorable_modes
  fallback: !input fallback_mode
  co2_recovered: !input co2_stop
  humidity_recovered: !input humidity_stop
  pm25_maximum: !input pm25_limit

triggers:
  - trigger: numeric_state
    id: co2
    entity_id: !input co2_sensor
    above: !input co2_start
    for: !input trigger_duration
  - trigger: numeric_state
    id: humidity
    entity_id: !input humidity_sensor
    above: !input humidity_start
    for: !input trigger_duration
  - trigger: state
    id: predictive
    entity_id: !input predictive_demand_sensors
    to: "on"
    for: !input predictive_trigger_duration
  - trigger: homeassistant
    id: restart
    event: start

conditions:
  - condition: or
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'restart' and is_state(ownership_entity, 'on') }}
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['co2', 'humidity', 'predictive'] }}"
          - condition: state
            entity_id: !input ownership_helper
            state: "off"
          - condition: template
            value_template: >-
              {{ states(co2_entity) not in ['unknown', 'unavailable']
                 and states(humidity_entity) not in ['unknown', 'unavailable']
                 and states(pm25_entity) not in ['unknown', 'unavailable'] }}
          - condition: template
            value_template: >-
              {{ states(pm25_entity) | float(999) < pm25_maximum | float }}
          - condition: template
            value_template: >-
              {{ trigger.id != 'predictive'
                 or (predictive_demand | count > 0
                     and expand(predictive_demand)
                         | selectattr('state', 'eq', 'on') | list | count > 0) }}
          - condition: template
            value_template: >-
              {% set required = additional_safety | count %}
              {{ required == 0
                 or expand(additional_safety)
                    | selectattr('state', 'eq', 'on') | list | count == required }}
          - condition: template
            value_template: >-
              {% set eligible = eligible_modes_text.split(',') | map('trim') | list %}
              {{ states(ventilation_entity) in eligible }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'restart' }}"
        sequence:
          - wait_template: >-
              {{ states(ventilation_entity) not in ['unknown', 'unavailable'] }}
            timeout: "00:05:00"
            continue_on_timeout: false
          - if:
              - condition: template
                value_template: "{{ not is_state(ventilation_entity, boost_mode) }}"
            then:
              - action: timer.cancel
                target:
                  entity_id: !input maximum_timer
              - action: input_boolean.turn_off
                target:
                  entity_id: !input ownership_helper
              - stop: Ventilation mode changed while Home Assistant was offline
          - if:
              - condition: template
                value_template: "{{ not is_state(maximum_timer_entity, 'active') }}"
            then:
              - variables:
                  restore_mode: >-
                    {% set restorable = restorable_modes_text.split(',') | map('trim') | list %}
                    {% set previous = states(previous_mode_entity) %}
                    {{ previous if previous in restorable else fallback }}
              - action: select.select_option
                target:
                  entity_id: !input ventilation_mode
                data:
                  option: "{{ restore_mode }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: !input ownership_helper
              - stop: Boost deadline elapsed while Home Assistant was offline
    default:
      - action: input_select.select_option
        target:
          entity_id: !input previous_mode_helper
        data:
          option: "{{ states(ventilation_entity) }}"
      - action: input_boolean.turn_on
        target:
          entity_id: !input ownership_helper
      - action: timer.start
        target:
          entity_id: !input maximum_timer
        data:
          duration: !input maximum_duration
      - action: select.select_option
        target:
          entity_id: !input ventilation_mode
        data:
          option: !input boost_option
  - wait_for_trigger:
      - trigger: template
        value_template: >-
          {{ states(co2_entity) | float(9999) < co2_recovered | float
             and states(humidity_entity) | float(999) < humidity_recovered | float }}
        for: !input recovery_duration
      - trigger: template
        value_template: >-
          {{ states(pm25_entity) in ['unknown', 'unavailable']
             or states(pm25_entity) | float(999) >= pm25_maximum | float }}
        for: "00:05:00"
      - trigger: template
        value_template: >-
          {% set required = additional_safety | count %}
          {{ required > 0
             and expand(additional_safety)
                 | selectattr('state', 'eq', 'on') | list | count < required }}
        for: !input additional_safety_duration
      - trigger: template
        value_template: >-
          {{ states(ventilation_entity) not in [boost_mode, 'unknown', 'unavailable'] }}
      - trigger: state
        entity_id: !input maximum_timer
        from: active
        to: idle
  - if:
      - condition: state
        entity_id: !input ownership_helper
        state: "on"
      - condition: template
        value_template: "{{ is_state(ventilation_entity, boost_mode) }}"
    then:
      - variables:
          restore_mode: >-
            {% set restorable = restorable_modes_text.split(',') | map('trim') | list %}
            {% set previous = states(previous_mode_entity) %}
            {{ previous if previous in restorable else fallback }}
      - action: select.select_option
        target:
          entity_id: !input ventilation_mode
        data:
          option: "{{ restore_mode }}"
  - action: timer.cancel
    target:
      entity_id: !input maximum_timer
  - action: input_boolean.turn_off
    target:
      entity_id: !input ownership_helper

mode: single
max_exceeded: silent
