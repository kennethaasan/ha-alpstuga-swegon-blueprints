blueprint:
  name: ALPSTUGA – avgrenset ventilasjonsforsering / bounded ventilation boost
  description: >-
    Starter en tidsavgrenset ventilasjonsforsering ved vedvarende høy CO₂ eller
    luftfuktighet. Avviser utrygg PM2,5, gjenoppretter forrige normalmodus etter
    bedring eller maksimal tid og overstyrer aldri en senere manuell endring.
    Requests bounded ventilation Boost after sustained high CO2 or humidity,
    with the same safety, recovery, timeout, and manual-override guarantees.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    co2_sensor:
      name: CO₂-sensor / CO2 sensor
      description: ALPSTUGAs sensor for karbondioksid / carbon-dioxide concentration.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: carbon_dioxide
    humidity_sensor:
      name: Luftfuktighetssensor / Humidity sensor
      description: ALPSTUGAs sensor for relativ luftfuktighet / relative humidity.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: humidity
    pm25_sensor:
      name: PM2,5-sensor / PM2.5 sensor
      description: ALPSTUGAs PM2,5-sensor som brukes som sikkerhetsgrense / safety limit.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: pm25
    predictive_demand_sensors:
      name: Prediktive behovssensorer / Predictive demand sensors
      description: >-
        Valgfrie binærsensorer som slås på før en målt grense nås, for eksempel
        et CO₂-varsel basert på stigningstakt. Optional sensors may request
        Boost early; all normal safety and mode checks still apply.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
          multiple: true
    predictive_trigger_duration:
      name: Vedvarende prediktivt behov før start / Predictive demand duration
      default: "00:05:00"
      selector:
        duration:
    additional_safety_entities:
      name: Ekstra sikkerhetsenheter / Additional safety entities
      description: >-
        Valgfrie binærsensorer som alle må være på for automatisk forsering.
        Bruk dem for alarmer, fersk telemetri eller hovedbryter. Optional safety
        entities treat missing, unavailable, unknown, or off as unsafe.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
          multiple: true
    additional_safety_duration:
      name: Varighet på sikkerhetsfeil før gjenoppretting / Safety-failure duration
      default: "00:05:00"
      selector:
        duration:
    ventilation_mode:
      name: Ventilasjonsmodus / Ventilation mode
      description: Valgenheten som styrer ventilasjonsmodus / operating-mode select entity.
      selector:
        entity:
          filter:
            - domain: select
    ownership_helper:
      name: Hjelper for eierskap til forsering / Boost ownership helper
      description: >-
        Av/på-hjelper som husker at automasjonen eier forseringen gjennom en
        omstart av Home Assistant / persists ownership across a restart.
      selector:
        entity:
          filter:
            - domain: input_boolean
    previous_mode_helper:
      name: Hjelper for forrige modus / Previous-mode helper
      description: >-
        Valghjelper som lagrer normalmodusen som skal gjenopprettes. Alternativene
        må omfatte alle tillatte moduser og reservemodusen / must include every
        eligible and fallback mode.
      selector:
        entity:
          filter:
            - domain: input_select
    maximum_timer:
      name: Tidsur for maksimal varighet / Maximum-duration timer
      description: >-
        Tidsur som lagrer absolutt sluttid. Aktiver gjenoppretting; blueprinten
        angir varigheten ved start / enable restore; duration is supplied at start.
      selector:
        entity:
          filter:
            - domain: timer
    boost_option:
      name: Verdi for forsering / Boost option
      default: boost
      selector:
        text:
    eligible_modes:
      name: Moduser automasjonen kan overta / Eligible modes
      description: Kommaseparerte normalmoduser; bortemoduser skal ikke tas med / comma-separated normal modes.
      default: "automatic,home,home_plus"
      selector:
        text:
    restorable_modes:
      name: Skrivbare moduser som kan gjenopprettes / Restorable modes
      description: >-
        Kommaseparert delmengde som integrasjonen kan skrive. Skrivebeskyttede
        automatiske tilstander bruker reservemodusen / writable eligible modes.
      default: "home,home_plus"
      selector:
        text:
    fallback_mode:
      name: Trygg reservemodus / Safe fallback mode
      description: Brukes bare hvis forrige modus ikke lenger er tillatt / used only when previous mode is ineligible.
      default: home
      selector:
        text:
    co2_start:
      name: Startgrense for CO₂ / CO2 start threshold
      default: 1000
      selector:
        number:
          min: 600
          max: 2500
          step: 50
          unit_of_measurement: ppm
    co2_stop:
      name: Gjenopprettingsgrense for CO₂ / CO2 recovery threshold
      default: 800
      selector:
        number:
          min: 400
          max: 1500
          step: 50
          unit_of_measurement: ppm
    humidity_start:
      name: Startgrense for luftfuktighet / Humidity start threshold
      default: 65
      selector:
        number:
          min: 40
          max: 90
          step: 1
          unit_of_measurement: "%"
    humidity_stop:
      name: Gjenopprettingsgrense for luftfuktighet / Humidity recovery threshold
      default: 60
      selector:
        number:
          min: 30
          max: 80
          step: 1
          unit_of_measurement: "%"
    pm25_limit:
      name: Sikkerhetsgrense for PM2,5 / PM2.5 safety limit
      default: 25
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: µg/m³
    trigger_duration:
      name: Vedvarende behov før start / Sustained demand duration
      default: "00:10:00"
      selector:
        duration:
    recovery_duration:
      name: Vedvarende bedring før gjenoppretting / Recovery duration
      default: "00:15:00"
      selector:
        duration:
    maximum_duration:
      name: Absolutt maksimal varighet / Hard maximum Boost duration
      default: "02:00:00"
      selector:
        duration:

variables:
  co2_entity: !input co2_sensor
  humidity_entity: !input humidity_sensor
  pm25_entity: !input pm25_sensor
  predictive_demand: !input predictive_demand_sensors
  additional_safety: !input additional_safety_entities
  ventilation_entity: !input ventilation_mode
  ownership_entity: !input ownership_helper
  previous_mode_entity: !input previous_mode_helper
  maximum_timer_entity: !input maximum_timer
  boost_mode: !input boost_option
  eligible_modes_text: !input eligible_modes
  restorable_modes_text: !input restorable_modes
  fallback: !input fallback_mode
  co2_recovered: !input co2_stop
  humidity_recovered: !input humidity_stop
  pm25_maximum: !input pm25_limit

triggers:
  - trigger: numeric_state
    id: co2
    entity_id: !input co2_sensor
    above: !input co2_start
    for: !input trigger_duration
  - trigger: numeric_state
    id: humidity
    entity_id: !input humidity_sensor
    above: !input humidity_start
    for: !input trigger_duration
  - trigger: state
    id: predictive
    entity_id: !input predictive_demand_sensors
    to: "on"
    for: !input predictive_trigger_duration
  - trigger: homeassistant
    id: restart
    event: start

conditions:
  - condition: or
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'restart' and is_state(ownership_entity, 'on') }}
      - condition: and
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['co2', 'humidity', 'predictive'] }}"
          - condition: state
            entity_id: !input ownership_helper
            state: "off"
          - condition: template
            value_template: >-
              {{ states(co2_entity) not in ['unknown', 'unavailable']
                 and states(humidity_entity) not in ['unknown', 'unavailable']
                 and states(pm25_entity) not in ['unknown', 'unavailable'] }}
          - condition: template
            value_template: >-
              {{ states(pm25_entity) | float(999) < pm25_maximum | float }}
          - condition: template
            value_template: >-
              {{ trigger.id != 'predictive'
                 or (predictive_demand | count > 0
                     and expand(predictive_demand)
                         | selectattr('state', 'eq', 'on') | list | count > 0) }}
          - condition: template
            value_template: >-
              {% set required = additional_safety | count %}
              {{ required == 0
                 or expand(additional_safety)
                    | selectattr('state', 'eq', 'on') | list | count == required }}
          - condition: template
            value_template: >-
              {% set eligible = eligible_modes_text.split(',') | map('trim') | list %}
              {{ states(ventilation_entity) in eligible }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'restart' }}"
        sequence:
          - wait_template: >-
              {{ states(ventilation_entity) not in ['unknown', 'unavailable'] }}
            timeout: "00:05:00"
            continue_on_timeout: false
          - if:
              - condition: template
                value_template: "{{ not is_state(ventilation_entity, boost_mode) }}"
            then:
              - action: timer.cancel
                target:
                  entity_id: !input maximum_timer
              - action: input_boolean.turn_off
                target:
                  entity_id: !input ownership_helper
              - stop: Ventilasjonsmodus ble endret mens Home Assistant var frakoblet / mode changed while offline
          - if:
              - condition: template
                value_template: "{{ not is_state(maximum_timer_entity, 'active') }}"
            then:
              - variables:
                  restore_mode: >-
                    {% set restorable = restorable_modes_text.split(',') | map('trim') | list %}
                    {% set previous = states(previous_mode_entity) %}
                    {{ previous if previous in restorable else fallback }}
              - action: select.select_option
                target:
                  entity_id: !input ventilation_mode
                data:
                  option: "{{ restore_mode }}"
              - action: input_boolean.turn_off
                target:
                  entity_id: !input ownership_helper
              - stop: Tidsfristen utløp mens Home Assistant var frakoblet / Boost deadline elapsed while offline
    default:
      - action: input_select.select_option
        target:
          entity_id: !input previous_mode_helper
        data:
          option: "{{ states(ventilation_entity) }}"
      - action: input_boolean.turn_on
        target:
          entity_id: !input ownership_helper
      - action: timer.start
        target:
          entity_id: !input maximum_timer
        data:
          duration: !input maximum_duration
      - action: select.select_option
        target:
          entity_id: !input ventilation_mode
        data:
          option: !input boost_option
  - wait_for_trigger:
      - trigger: template
        value_template: >-
          {{ states(co2_entity) | float(9999) < co2_recovered | float
             and states(humidity_entity) | float(999) < humidity_recovered | float }}
        for: !input recovery_duration
      - trigger: template
        value_template: >-
          {{ states(pm25_entity) in ['unknown', 'unavailable']
             or states(pm25_entity) | float(999) >= pm25_maximum | float }}
        for: "00:05:00"
      - trigger: template
        value_template: >-
          {% set required = additional_safety | count %}
          {{ required > 0
             and expand(additional_safety)
                 | selectattr('state', 'eq', 'on') | list | count < required }}
        for: !input additional_safety_duration
      - trigger: template
        value_template: >-
          {{ states(ventilation_entity) not in [boost_mode, 'unknown', 'unavailable'] }}
      - trigger: state
        entity_id: !input maximum_timer
        from: active
        to: idle
  - if:
      - condition: state
        entity_id: !input ownership_helper
        state: "on"
      - condition: template
        value_template: "{{ is_state(ventilation_entity, boost_mode) }}"
    then:
      - variables:
          restore_mode: >-
            {% set restorable = restorable_modes_text.split(',') | map('trim') | list %}
            {% set previous = states(previous_mode_entity) %}
            {{ previous if previous in restorable else fallback }}
      - action: select.select_option
        target:
          entity_id: !input ventilation_mode
        data:
          option: "{{ restore_mode }}"
  - action: timer.cancel
    target:
      entity_id: !input maximum_timer
  - action: input_boolean.turn_off
    target:
      entity_id: !input ownership_helper

mode: single
max_exceeded: silent
